name: Check and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Rust checks and static WASM build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check native lint and compilation
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test PDF core and state protocol
        run: cargo test --locked --workspace
      - name: Check browser lint and compilation
        run: cargo clippy --locked -p presenter-web --target wasm32-unknown-unknown -- -D warnings
      - name: Install matching WASM bindings generator
        run: cargo install --locked wasm-bindgen-cli --version 0.2.129
      - name: Install pinned WASM validator
        run: cargo install --locked wasm-tools --version 1.245.1 --no-default-features --features validate
      - name: Build and validate SIMD128 distribution
        run: scripts/build.sh
      - name: Package Pages site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist
          retention-days: 7

  deploy:
    name: Deploy GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true
      - name: Publish static application
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
