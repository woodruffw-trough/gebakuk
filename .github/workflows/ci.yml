name: Check and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Rust checks and static WASM build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      pages_artifact_name: ${{ steps.pages-artifact.outputs.name }}
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
      - name: Restore pinned WASM tools
        id: tools-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/bin/wasm-tools
          key: wasm-tools-v1-ubuntu24.04-${{ runner.os }}-${{ runner.arch }}-rust1.99.0-bindgen0.2.129-validator1.245.1-validate-${{ hashFiles('rust-toolchain.toml') }}
      - name: Restore Cargo dependencies and build outputs
        id: cargo-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
            ~/.cargo/git/checkouts
            target
          key: cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.toml', 'crates/**/Cargo.toml', '.cargo/config.toml') }}-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('crates/**/*.rs') }}
          restore-keys: |
            cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.toml', 'crates/**/Cargo.toml', '.cargo/config.toml') }}-${{ hashFiles('Cargo.lock') }}-
            cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.toml', 'crates/**/Cargo.toml', '.cargo/config.toml') }}-
            cargo-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check native lint and compilation
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test PDF core and state protocol
        run: cargo test --locked --workspace
      - name: Check browser lint and compilation
        run: cargo clippy --locked -p presenter-web --target wasm32-unknown-unknown -- -D warnings
      - name: Install matching WASM bindings generator
        run: |
          if [[ "$(wasm-bindgen --version 2>/dev/null || true)" != "wasm-bindgen 0.2.129" ]]; then
            cargo install --locked --force wasm-bindgen-cli --version 0.2.129
          fi
      - name: Install pinned WASM validator
        run: |
          if [[ "$(wasm-tools --version 2>/dev/null || true)" != "wasm-tools 1.245.1" ]]; then
            cargo install --locked --force wasm-tools --version 1.245.1 --no-default-features --features validate
          fi
      - name: Build and validate SIMD128 distribution
        run: scripts/build.sh
      - name: Select Pages artifact name
        id: pages-artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: echo "name=github-pages-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Package Pages site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          name: ${{ steps.pages-artifact.outputs.name }}
          path: dist
          retention-days: 7
      # PRs restore default-branch caches; only successful main builds populate them.
      - name: Save pinned WASM tools
        if: success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/bin/wasm-tools
          key: ${{ steps.tools-cache.outputs.cache-primary-key }}
      - name: Save Cargo dependencies and build outputs
        if: success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
            ~/.cargo/git/checkouts
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  deploy:
    name: Deploy GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true
      - name: Publish static application
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          artifact_name: ${{ needs.check.outputs.pages_artifact_name }}
