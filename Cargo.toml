[workspace]
members = ["crates/presenter-core", "crates/presenter-web", "xtask"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
hayro = { version = "=0.8.0", default-features = false, features = ["embed-fonts", "embed-cmaps"] }
lopdf = { version = "=0.45.0", default-features = false, features = ["wasm_js"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
js-sys = "=0.3.106"
web-sys = "=0.3.106"
weezl = "=0.2.1"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
panic = "abort"
debug = false
strip = "debuginfo"

